name: Mule CI/CD
 
on:
  push:
    branches:
      - main
      - develop
      - feature/**
 
jobs:
 
  build:
    runs-on: ubuntu-latest
 
    steps:
 
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
 
      - name: Build Mule Application
        run: |
          mvn clean deploy \
          --settings .settings/settings.xml \
          -DskipMunitTests \
          -Danypoint.username="JahnaviMay" \
          -Danypoint.password="Jahnavi@2002"
 
  deploy-design:
    if: startsWith(github.ref, 'refs/heads/feature/')
    needs: build
    runs-on: ubuntu-latest
 
    steps:
 
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Deploy to Design Environment
        run: |
          mvn deploy \
          --settings .settings/settings.xml \
          -DmuleDeploy \
          -DskipMunitTests \
          -Danypoint.username="JahnaviMay" \
          -Danypoint.password="Jahnavi@2002" \
          -Danypoint.businessGroup="d52bf520-4177-4108-9a6f-eb464d3bd9e2" \
          -Dappname="case-support-design" \
          -Denv="Design"
 
  deploy-sandbox:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
 
    steps:
 
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Deploy to Sandbox Environment
        run: |
          mvn deploy \
          --settings .settings/settings.xml \
          -DmuleDeploy \
          -DskipMunitTests \
          -Danypoint.username="JahnaviMay" \
          -Danypoint.password="Jahnavi@2002" \
          -Danypoint.businessGroup="d52bf520-4177-4108-9a6f-eb464d3bd9e2" \
          -Dappname="case-support-sandbox" \
          -Denv="Sandbox"
 
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
 
    steps:
 
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Deploy to Prod Environment
        run: |
          mvn deploy \
          --settings .settings/settings.xml \
          -DmuleDeploy \
          -DskipMunitTests \
          -Danypoint.username="JahnaviMay" \
          -Danypoint.password="Jahnavi@2002" \
          -Danypoint.businessGroup="d52bf520-4177-4108-9a6f-eb464d3bd9e2" \
          -Dappname="case-support-prod" \
          -Denv="Prod"
